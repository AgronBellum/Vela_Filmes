<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script> 
    <script>
        function updatePercent(percent){
            //console.log(percent);
            $(".updatePercent").css("width", percent+"%");
        }

        function errorUpdate(message){
            $(".messageUpdate").text(message);
            $("img").remove()
            $(".updateBarra").remove()
        }
    </script>
</head>

<body>
    <div id="update">
        <div class="icon"></div>
        <div class="messageUpdate" style="font-size: 18px;color: #e9e9e9;margin-top: 10px;">Aguarde um pouco, estamos atualizando seu
            aplicativo...
        </div><img src="img/loading.svg">
        <div class="updateBarra" style="margin-top: 20px;width: 45%;    height: 30px;    background-color: #e9e9e9;    border-radius: 4px;">
            <div class="updatePercent"
                style="    width: 1%;    height: 100%;    background-color: #FD5D5D;    border-radius: 4px;"></div>
        </div>
    </div>
</body>

</html>
